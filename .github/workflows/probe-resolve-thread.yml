        run: |
          q='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){reviewThreads(first:50){nodes{id isResolved comments(first:1){nodes{databaseId body}}}}}}}'
          found=$(gh api graphql -f query="$q" -f o="${REPO%/*}" -f n="${REPO#*/}" -F p="$PR" \
