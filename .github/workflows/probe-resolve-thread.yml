          found=$(gh api graphql -f query="$q" -f o="${REPO%/*}" -f n="${REPO#*/}" -F p="$PR" \
            --jq ".data.repository.pullRequest.reviewThreads.nodes[] | select(.comments.nodes[0].body | contains(\"$TAG \")) | \"\(.id) \(.comments.nodes[0].databaseId)\"" 2>&1) || { echo "LOOKUP $TAG: FAIL $found"; exit 1; }
          read -r tid cid <<<"$found"
          echo "thread $tid first comment $cid"
          if out=$(gh api -X POST "repos/$REPO/pulls/$PR/comments/$cid/replies" -f body="resolved in probe: $TAG" 2>&1 >/dev/null); then echo "REPLY $TAG: ok"; else echo "REPLY $TAG: FAIL $out"; fi
          m='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}'
          if out=$(gh api graphql -f query="$m" -f id="$tid" 2>&1); then echo "RESOLVE $TAG: ok $out"; else echo "RESOLVE $TAG: FAIL $out"; fi
  c:
    runs-on: ubuntu-latest
    permissions: {pull-requests: write, issues: write}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
