# e2e caller (ADR-0028): runs esciara/ai-workflows@e2e-target, only for e2e items:
# - pull_request events: head branch starts with `e2e/` AND the head repo is this repo (fork PRs never route by
#   prefix), or the PR is labelled `e2e-target`. The prefix lets a PR's first `opened` event route here: the pulls API
#   cannot set labels at creation.
# - issues and issue_comment events (comments on PRs too): labelled `e2e-target`. A comment payload has no head ref
#   (github.head_ref is empty), so a PR's comments route by label; the e2e helpers label every test PR after creation.
# A test holds the e2e slot (ADR-0026), pushes its WP branch to `e2e-target`, then opens e2e items; the normal
# caller (ai-workflows.yml) skips exactly those. Config comes from .github/ai-workflows-e2e.yml here (ordinary
# `config_path` input), not .github/ai-workflows.yml. Items labelled `e2e-crash` get an invalid model token, so their
# first agent job fails (WP12a's forced crash; the product has no test hook, ADR-0050). Mirrors ai-workflows.yml otherwise.
# Own-workflow refs are branches on purpose (ADR-0022); pinning comes with WP14.
name: AI workflows (e2e)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Fork PRs only, API calls only (ADR-0044): a fork push removes a stale verdict label. Never checks out the PR.
  pull_request_target:
    types: [synchronize]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

# One group per item for pushes and commands: a new push waits for the running review, never runs beside it. A group keeps
# only one pending run, so a comment that cannot be a command gets its own group (the run_id): it never replaces a
# queued review. A command is `/` after at most 3 spaces on the first non-blank line (ADR-0005); any comment with `/`
# at its start, after a space or after a newline stays in the item's group (a false positive only waits).
concurrency:
  group: ai-workflows-e2e-${{ github.event_name == 'pull_request_target' && 'fork-push-' || '' }}${{ github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/') && !contains(github.event.comment.body, ' /') && !contains(github.event.comment.body, fromJSON('"\n/"')) && format('comment-{0}-', github.run_id) || '' }}${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

# Least privilege by default (ADR-0017); every job below grants what its called workflow needs.
permissions: {}

jobs:
  # The routing gate, checked on every event (issues, issue_comment, pull_request). Every other job needs config.
  # TWIN: the normal caller's `config` job (ai-workflows.yml) has the exact negation of this `if:`; change both together.
  config:
    if: ${{ (startsWith(github.head_ref, 'e2e/') && github.event.pull_request.head.repo.full_name == github.repository) || contains(github.event.pull_request.labels.*.name, 'e2e-target') || contains(github.event.issue.labels.*.name, 'e2e-target') }}
    uses: esciara/ai-workflows/.github/workflows/config.yml@e2e-target
    permissions:
      contents: read
    with:
      config_path: .github/ai-workflows-e2e.yml

  # Workflow A (WP2+). review.yml is a placeholder on ai-workflows main until WP2 lands.
  review:
    needs: config
    if: needs.config.outputs.review == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request))
    uses: esciara/ai-workflows/.github/workflows/review.yml@e2e-target
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    with:
      config: ${{ needs.config.outputs.config }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ (contains(github.event.issue.labels.*.name, 'e2e-crash') || contains(github.event.pull_request.labels.*.name, 'e2e-crash')) && 'e2e-crash-invalid-token' || secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Workflow A, fork PRs (ADR-0044): a fork push after a review removes the verdict label. No secrets, no checkout.
  review-fork-push:
    needs: config
    if: needs.config.outputs.review == 'true' && github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    uses: esciara/ai-workflows/.github/workflows/review-fork-push.yml@e2e-target
    permissions:
      pull-requests: write

  # Workflow B (WP5+). triage.yml is a placeholder on ai-workflows main until WP5 lands.
  triage:
    needs: config
    if: needs.config.outputs.triage == 'true' && (github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request))
    uses: esciara/ai-workflows/.github/workflows/triage.yml@e2e-target
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      config: ${{ needs.config.outputs.config }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ (contains(github.event.issue.labels.*.name, 'e2e-crash') || contains(github.event.pull_request.labels.*.name, 'e2e-crash')) && 'e2e-crash-invalid-token' || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
