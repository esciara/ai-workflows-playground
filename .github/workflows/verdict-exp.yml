# test-fixture: experiment for ADR-0055 (pending commit status vs required check-run of the same name). Delete after.
name: verdict-exp
on:
  pull_request:
    branches: [verdict-exp-base]
permissions: {}
jobs:
  verdict:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          state=$(cat exp-state)
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context=verdict -f description="waiting for maintainer approval of ${SHA:0:7} (experiment)"
          [ "$(cat exp-exit)" = 0 ]
