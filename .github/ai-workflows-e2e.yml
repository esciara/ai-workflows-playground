# Config for the e2e slot callers (caller-e2e-<n>.yml pass `config_path: .github/ai-workflows-e2e.yml`); normal runs read
# .github/ai-workflows.yml. Moved here from esciara/ai-workflows tests/e2e/config/playground.yml (ADR-0050).
maintainers: [esciara]
default_branch: main
setup: python3 -m venv .venv && .venv/bin/pip install -e '.[test]'
test: .venv/bin/pytest
# Sandbox egress for setup/test (ADR-0037): the package registries only.
allowed_domains: [pypi.org, files.pythonhosted.org]
risk_paths:
  high: [".github/**"]
workflows:
  review: true
  triage: true
# Chat alerts (e.g. "new issue triaged") go to Slack and Telegram; the e2e slot callers pass the chat secrets.
notify: slack,telegram
# ADR-0058: e2e issues come from the outside tester and count toward the triage caps; raised so parallel e2e runs aren't capped.
limits:
  triage_per_author_per_day: 50
  triage_per_day: 200
# WP7 reporter silence in minutes (decimal days): ping ~10, stale ~15, close ~16 minutes after B2 asks. actions/stale
# rounds close - stale down to 0 days, so it closes in the run that labels `stale` (spec: Reporter silence).
reporter_silence_days: {ping: 0.007, stale: 0.0105, close: 0.011}
